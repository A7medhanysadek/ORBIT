name: "Orbit CI/CD Pipeline"

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: "🧪 Build & Unit Tests"
    runs-on: windows-latest

    steps:
    - name: "Checkout Code"
      uses: actions/checkout@v4

    - name: "Setup .NET 8 SDK"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: "Restore Dependencies"
      run: dotnet restore OrbitBackend.sln

    - name: "Build Solution"
      run: dotnet build OrbitBackend.sln --no-restore --configuration Release

    - name: "Run Unit Tests"
      run: dotnet test OrbitBackend.sln --no-build --configuration Release --verbosity normal

  deploy-to-monsterasp:
    name: "🚀 Deploy API to MonsterASP.NET"
    needs: build-and-test
    runs-on: windows-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'

    steps:
    - name: "Checkout Code"
      uses: actions/checkout@v4

    - name: "Setup .NET 8 SDK"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: "Resolve Deployment Credentials"
      id: creds
      shell: pwsh
      env:
        SERVER_SECRET: ${{ secrets.MONSTERASP_SERVER }}
        SITE_SECRET: ${{ secrets.MONSTERASP_WEBSITE_NAME }}
        USER_SECRET: ${{ secrets.MONSTERASP_USERNAME }}
        PASS_SECRET: ${{ secrets.MONSTERASP_PASSWORD }}
        FTP_PASS_SECRET: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
      run: |
        $server = if ($env:SERVER_SECRET) { $env:SERVER_SECRET } else { "site80600.siteasp.net" }
        $site = if ($env:SITE_SECRET) { $env:SITE_SECRET } else { "site80600" }
        $user = if ($env:USER_SECRET) { $env:USER_SECRET } else { "site80600" }
        $pass = if ($env:PASS_SECRET) { $env:PASS_SECRET } else { "Gs2@9_nMzH#5" }
        $ftpPass = if ($env:FTP_PASS_SECRET) { $env:FTP_PASS_SECRET } else { "hZ?65dD@+4cN" }

        Add-Content -Path $env:GITHUB_OUTPUT -Value "server=$server"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "site=$site"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "user=$user"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "pass=$pass"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "ftp_pass=$ftpPass"

        Write-Host "::add-mask::$pass"
        Write-Host "::add-mask::$ftpPass"

    - name: "Restore API Dependencies"
      run: dotnet restore OrbitBackend/OrbitBackend.csproj --runtime win-x86

    - name: "Publish API Project (win-x86)"
      run: dotnet publish OrbitBackend/OrbitBackend.csproj --configuration Release --runtime win-x86 --no-self-contained --output ./publish

    - name: "🚀 Deploy to MonsterASP.NET via MSDeploy"
      id: msdeploy
      continue-on-error: true
      shell: pwsh
      run: |
        $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
        if (-not (Test-Path $msdeploy)) {
            $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
        }
        if (-not (Test-Path $msdeploy)) {
            throw "msdeploy.exe was not found on the runner."
        }
        
        $server = "${{ steps.creds.outputs.server }}"
        $site = "${{ steps.creds.outputs.site }}"
        $username = "${{ steps.creds.outputs.user }}"
        $password = "${{ steps.creds.outputs.pass }}"
        $sourceDir = (Resolve-Path ./publish).Path

        Write-Host "Target Site: $site"
        Write-Host "Target Server: $server"
        Write-Host "Publishing to https://${server}:8172/msdeploy.axd?site=${site} ..."

        & $msdeploy `
          -verb:sync `
          -source:contentPath="$sourceDir" `
          -dest:contentPath="$site",computerName="https://${server}:8172/msdeploy.axd?site=${site}",userName="$username",password="$password",authType="Basic" `
          -enableRule:AppOffline `
          -allowUntrusted `
          -verbose

    - name: "📂 Fallback Deploy via FTP if MSDeploy fails"
      if: steps.msdeploy.outcome != 'success'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ steps.creds.outputs.server }}
        username: ${{ steps.creds.outputs.user }}
        password: ${{ steps.creds.outputs.ftp_pass }}
        local-dir: ./publish/
        server-dir: /wwwroot/
