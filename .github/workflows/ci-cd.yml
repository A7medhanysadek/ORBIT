name: Orbit CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: 🧪 Build & Unit Tests
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore OrbitBackend.sln

    - name: Build Solution
      run: dotnet build OrbitBackend.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test OrbitBackend.sln --no-build --configuration Release --verbosity normal

  deploy-to-monsterasp:
    name: 🚀 Deploy API to MonsterASP.NET
    needs: build-and-test
    runs-on: windows-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore API Dependencies
      run: dotnet restore OrbitBackend/OrbitBackend.csproj

    - name: Publish API Project
      run: dotnet publish OrbitBackend/OrbitBackend.csproj --configuration Release --output ./publish

    - name: 🚀 Deploy to MonsterASP.NET via MSDeploy
      id: msdeploy
      continue-on-error: true
      shell: pwsh
      run: |
        $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
        if (-not (Test-Path $msdeploy)) {
            $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
        }
        if (-not (Test-Path $msdeploy)) {
            throw "msdeploy.exe was not found on the runner."
        }
        
        $site = "${{ secrets.MONSTERASP_WEBSITE_NAME || 'site80600' }}"
        $server = "${{ secrets.MONSTERASP_SERVER || 'site80600.siteasp.net' }}"
        $username = "${{ secrets.MONSTERASP_USERNAME || 'site80600' }}"
        $password = "${{ secrets.MONSTERASP_PASSWORD || 'Gs2@9_nMzH#5' }}"
        $sourceDir = (Resolve-Path ./publish).Path

        Write-Host "Target Site: $site"
        Write-Host "Target Server: $server"
        Write-Host "Deploying from $sourceDir to https://${server}:8172/msdeploy.axd?site=${site} ..."

        & $msdeploy `
          -verb:sync `
          -source:contentPath="$sourceDir" `
          -dest:contentPath="$site",computerName="https://${server}:8172/msdeploy.axd?site=${site}",userName="$username",password="$password",authType="Basic" `
          -enableRule:AppOffline `
          -allowUntrusted `
          -verbose

    - name: 📂 Fallback: Deploy via FTP if MSDeploy fails
      if: steps.msdeploy.outcome != 'success'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: site80600.siteasp.net
        username: site80600
        password: ${{ secrets.MONSTERASP_FTP_PASSWORD || 'hZ?65dD@+4cN' }}
        local-dir: ./publish/
        server-dir: /
